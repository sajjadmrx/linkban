name: Build & Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_type:
        type: choice
        description: 'Build Type (Release or Demo)'
        required: true
        default: 'release'
        options:
          - 'release'
          - 'demo'

jobs:
  build-and-release:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi

      - name: Build Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Prepare Release Artifacts
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          BUILD_TYPE: ${{ github.event.inputs.release_type || 'release' }}
        run: |
          mkdir -p release-assets
          VERSION="${RELEASE_VERSION:-v1.0.0}"
          TYPE="${BUILD_TYPE}"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "release-assets/linkban-${VERSION}-${TYPE}.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/linkban-${VERSION}-${TYPE}-unsigned.apk"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'demo' }}
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.release_type == 'demo' && 'Demo Release ' || 'Release ' }}${{ github.event.inputs.version || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
