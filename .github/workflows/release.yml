name: Build & Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_type:
        type: choice
        description: 'Build Type (Release or Demo)'
        required: true
        default: 'release'
        options:
          - 'release'
          - 'demo'

jobs:
  build-and-release:
    name: Build Android APK & Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync & Commit Version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          RAW_VERSION="$INPUT_VERSION"
          CLEAN_VERSION="${RAW_VERSION#v}"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull origin ${{ github.ref_name }} --rebase || true
          
          node -e "
            const fs = require('fs');
            const pkgPath = './package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$CLEAN_VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
            
            const gradlePath = './android/app/build.gradle';
            let gradle = fs.readFileSync(gradlePath, 'utf8');
            gradle = gradle.replace(/versionName \".*\"/, 'versionName \"' + '$CLEAN_VERSION' + '\"');
            gradle = gradle.replace(/versionCode (\d+)/, (match, p1) => 'versionCode ' + (parseInt(p1, 10) + 1));
            fs.writeFileSync(gradlePath, gradle);
          "
          
          git add package.json android/app/build.gradle
          
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): bump version to v$CLEAN_VERSION"
            git pull origin ${{ github.ref_name }} --rebase || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Sync Capacitor Android
        run: bunx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          fi

      - name: Build Android APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            ./gradlew assembleRelease
          fi

      - name: Prepare Release Artifacts
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          BUILD_TYPE: ${{ github.event.inputs.release_type || 'release' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release-assets"
          VERSION="${RELEASE_VERSION:-v1.0.0}"
          TYPE="${BUILD_TYPE}"
          cd android/app/build/outputs/apk/release
          for file in *.apk; do
            if [ -f "$file" ]; then
              cp "$file" "$GITHUB_WORKSPACE/release-assets/linkban-${VERSION}-${TYPE}-${file}"
            fi
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'demo' }}
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.release_type == 'demo' && 'Demo Release ' || 'Release ' }}${{ github.event.inputs.version || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
